# CodeQL analysis for Go and for the workflows themselves.
#
# The two matrix jobs report as `Analyze (go)` and `Analyze (actions)`, and both
# are **required status checks** on `main` and `development` (ruleset 18918362).
# A matrix job's check name comes from `name:` interpolated with the language,
# not from the job id — so renaming either one silently stops the gate from ever
# being satisfied, and the ruleset has to be updated in the same change.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]
  schedule:
    - cron: '22 7 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: go
          build-mode: autobuild
        - language: actions
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Go
      if: matrix.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: 'stable'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # The default suite plus lower-severity and lower-precision security
        # queries. Deliberately not `security-and-quality`, which layers
        # maintainability and reliability checks on top: `make check` already
        # runs gofmt and go vet, and routing style findings into the security
        # tab is how a security tab stops being read.
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
