name: snapshot-release

# Publishes a mutable pre-release of the CLI from the development branch. Each
# push rebuilds cross-platform binaries and replaces the previous snapshot
# release, so testers on restricted environments always have the latest build
# without promoting every integration build to a formal release.
#
# The release is a published pre-release, not a draft: a draft release never
# creates its underlying git tag, so it lands as an orphaned "untagged-*"
# release that cannot be reliably found and replaced on the next run. A
# pre-release keeps it clearly non-stable while giving it a real, movable tag.
on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-release
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify
        run: |
          go vet ./...
          go test ./...

      # Reproducible builds — see release.yml (nfpm honors SOURCE_DATE_EPOCH,
      # which mod_timestamp doesn't cover for .deb/.rpm).
      - name: Set reproducible build timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build snapshot artifacts
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean

      # Fixed-name copies of the macOS archives. The versioned names embed the
      # snapshot commit, so their download URLs change every push; a rolling
      # Homebrew cask needs a stable URL. These copies give one — the `dist/*.tar.gz`
      # glob below then uploads them alongside the versioned archives. See the
      # kuberoutectl-snapshot cask in the ymedlop/homebrew-tap repo.
      - name: Stage fixed-name macOS archives for the rolling brew cask
        run: |
          cp dist/kuberoutectl_*_darwin_arm64.tar.gz dist/kuberoutectl_snapshot_darwin_arm64.tar.gz
          cp dist/kuberoutectl_*_darwin_amd64.tar.gz dist/kuberoutectl_snapshot_darwin_amd64.tar.gz

      - name: Publish rolling snapshot pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="development-snapshot"
          # Remove the previous snapshot (release + tag) so this stays a single
          # moving pre-release, then recreate it at the current commit.
          gh release delete "$tag" --yes --cleanup-tag || true
          gh release create "$tag" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "Development snapshot" \
            --notes "Automated snapshot from development @ ${GITHUB_SHA} (built $(date -u +%Y-%m-%dT%H:%M:%SZ))."
